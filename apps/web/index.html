<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__NAVIGATION_DEFAULT_TITLE__</title>
    <script>
      try {
        const cachedSettings = localStorage.getItem('userSettings')
        const cachedTitle = cachedSettings ? JSON.parse(cachedSettings)?.navTitle : null
        if (typeof cachedTitle === 'string' && cachedTitle.trim()) {
          document.title = cachedTitle.trim()
        }
      } catch {
        // 本地缓存不可用时保留构建阶段注入的默认标题。
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
